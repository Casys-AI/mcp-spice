name: Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      MCP_VIEW_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view
      MCP_VIEW_CONTRACTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-contracts
      MCP_VIEW_COMPONENTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-components
    steps:
      - uses: actions/checkout@v5

      - name: Checkout the exact split mcp-view source
        uses: actions/checkout@v5
        with:
          repository: Casys-AI/mcp-server
          ref: 8fad891839203122efbe2438ba81a6e7d08c9202
          path: .deps/mcp-server
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Require the release tag to match the package version
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME}" = "v$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"

      - name: Install tested ngspice baseline
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Verify source and native release gates
        run: NGSPICE_RUNS_DIR="$RUNNER_TEMP/mcp-spice-runs" SPICE_RUN_NATIVE=1 deno task release:check

  build-push:
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/casys-ai/mcp-spice
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
