name: Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/superworldsavior/mcp-spice

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      MCP_VIEW_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view
      MCP_VIEW_CONTRACTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-contracts
      MCP_VIEW_COMPONENTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-components
    steps:
      - uses: actions/checkout@v5

      - name: Checkout the exact split mcp-view source
        uses: actions/checkout@v5
        with:
          repository: Casys-AI/mcp-server
          ref: b08802df353bb25d25a1c8d64b22ea61b5287ae0
          path: .deps/mcp-server
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Require the release tag to match the package version
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME}" = "v$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"

      - name: Install tested ngspice baseline
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Verify source and native release gates
        run: NGSPICE_RUNS_DIR="$RUNNER_TEMP/mcp-spice-runs" SPICE_RUN_NATIVE=1 deno task release:check

  build-push:
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # JSR publishes from main independently of this tag workflow. Verification
  # therefore runs only after GHCR has been pushed, then waits a bounded time
  # for the JSR version to exist. Missing or mismatched surfaces fail closed.
  verify-published:
    if: github.event_name == 'push'
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Verify published JSR and GHCR artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --verify HEAD)"
          deno task verify:published \
            --git-tag "$TAG" \
            --expected-commit "$COMMIT" \
            --expected-source "$RELEASE_SOURCE" \
            --image "$REGISTRY_IMAGE" \
            --wait-timeout-ms 300000 \
            --wait-interval-ms 10000 \
            > "${RUNNER_TEMP}/published-evidence.json"

      - name: Archive published evidence
        uses: actions/upload-artifact@v4
        with:
          name: published-evidence
          path: ${{ runner.temp }}/published-evidence.json
          if-no-files-found: error
